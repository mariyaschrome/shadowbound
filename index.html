<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shadowbound</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="fog"></div>
        <button id="btn-sound" title="Toggle sound">🔉</button>
        <main class="game">
            <h1>Shadowbound</h1>

            <section id="story" class="panel">
                <p id="story-text">The night is quiet. Something in the shadows is waiting for you...</p>
                <p id="stats"></p>
                <div id="enemy" class="enemy"></div>
            </section>

            <section id="choices" class="choices"></section>

            <section class="choices">
                <button id="btn-explore">Explore</button>
                <button id="btn-magic">Cast Magic</button>
                <button id="btn-reset">New Game</button>
            </section>

            <section class="panel">
                <h2>Inventory</h2>
                <ul id="inventory"><li>Empty</li></ul>
            </section>

            <section class="panel">
                <h2>Map</h2>
                <div id="map" class="map"></div>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
