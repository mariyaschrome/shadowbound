<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shadowbound</title>
        <meta name="theme-color" content="#0b0714">
        <link rel="icon" href="data:image/svg+xml, <svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="fog"></div>
        <div id="title-screen" class="title-screen">
            <h1>Shadowbound</h1>
            <p class="tagline">The night chose you.</p>
            <div class="title-buttons">
                <button id="btn-continue">Continue</button>
                <button id="btn-start">New Game</button>
            </div>
        </div>
        <button id="btn-sound" title="Toggle sound">🔉</button>
        <main class="game hidden">
            <h1>Shadowbound</h1>

            <section id="story" class="panel">
                <p id="story-text">The night is quiet. Something in the shadows is waiting for you...</p>
                <p id="stats"></p>
                <div id="enemy" class="enemy"></div>
            </section>

            <section id="choices" class="choices"></section>

            <section class="choices utility">
                <button id="btn-explore">Explore</button>
                <button id="btn-magic">Cast Magic</button>
                <button id="btn-reset">New Game</button>
                <button id="btn-menu">Menu</button>
            </section>

            <section class="panel">
                <h2>Inventory</h2>
                <ul id="inventory"><li>Empty</li></ul>
            </section>

            <section class="panel">
                <h2>Map</h2>
                <div id="map" class="map"></div>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
